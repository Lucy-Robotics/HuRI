# The curated HuRI modules (tier 3). Being listed here is what "verified"
# means: the entry was reviewed in a pull request to this file, and CI checks
# it (check_registry.py) on every change. See ACCEPTANCE.md for what a listing
# requires, and README.md for how this directory becomes its own repository.
#
# `source` is where the reviewed code is: today a directory of the HuRI repo;
# once the packages live in their own repositories, a git submodule under
# modules/<name>, pinned at a tag: source = { submodule = "modules/stt", tag = "v0.1.0" }

schema = 1

