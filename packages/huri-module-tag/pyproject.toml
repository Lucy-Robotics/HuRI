[build-system]
requires = ["setuptools>=64,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "huri-module-tag"
version = "0.1.0"
description = "HuRI module: Text aggregator: stitches overlapping transcripts into one question"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huri-core[server]>=0.4.0.dev0,<0.5",
  "huri-events>=0.1,<0.2",
]

[project.entry-points."huri.modules"]
tag = "huri_tag.module:TAG"

[tool.setuptools.packages.find]
include = ["huri_tag*"]

[tool.setuptools.package-data]
huri_tag = ["huri_module.toml", "manifests/*/huri_module.toml"]
