[build-system]
requires = ["setuptools>=64,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "huri-events"
version = "0.1.0"
description = "The curated HuRI event vocabulary: the huri.* topics and their wire formats"
readme = "README.md"
requires-python = ">=3.10"
# Light on purpose: a client decodes every curated topic with this and
# huri-core[client], no torch, no ray.
dependencies = [
  "huri-core>=0.4.0.dev0,<0.5",
  "numpy>=1.26,<2",
]

# Topic -> event class. The huri.* namespace is reserved for this package.
[project.entry-points."huri.events"]
"huri.audio.in" = "huri_core.core.events:BytesEvent"  # inbound mic frames (raw int16 PCM)
"huri.audio.out" = "huri_events.audio:Audio"
"huri.voice" = "huri_events.speech:Voice"
"huri.transcript" = "huri_events.speech:Transcript"
"huri.emotion" = "huri_events.emotion:Emotion"
"huri.partial_question" = "huri_events.question:PartialQuestion"
"huri.question" = "huri_events.question:RAGQuestion"
"huri.token" = "huri_events.text:Token"
"huri.motion" = "huri_events.motion:Motion"

[tool.setuptools.packages.find]
include = ["huri_events*"]
