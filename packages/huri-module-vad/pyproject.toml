[build-system]
requires = ["setuptools>=64,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "huri-module-vad"
version = "0.1.0"
description = "HuRI module: Voice activity detection (WebRTC VAD): microphone frames in, speech segments out"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huri-core[server]>=0.4.0.dev0,<0.5",
  "huri-events>=0.1,<0.2",
  "numpy>=1.26,<2",
  "webrtcvad==2.0.10",
  # webrtcvad imports pkg_resources, removed in setuptools 82
  "setuptools<82",
]

[project.entry-points."huri.modules"]
vad = "huri_vad.module:VAD"

[tool.setuptools.packages.find]
include = ["huri_vad*"]

[tool.setuptools.package-data]
huri_vad = ["huri_module.toml", "manifests/*/huri_module.toml"]
