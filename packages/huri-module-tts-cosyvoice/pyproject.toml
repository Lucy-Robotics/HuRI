[build-system]
requires = ["setuptools>=64,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "huri-module-tts-cosyvoice"
version = "0.1.0"
description = "HuRI module: text to speech with CosyVoice3 (voice cloning, NVIDIA GPU)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huri-core[server]>=0.4.0.dev0,<0.5",
  "huri-events>=0.1,<0.2",
  "huri-tts>=0.1,<0.2",
  "numpy>=1.26,<2",
  "torch",
  "torchaudio",
]

[project.entry-points."huri.modules"]
tts_cosyvoice = "huri_tts_cosyvoice.module:CosyVoiceTTS"

[tool.setuptools.packages.find]
include = ["huri_tts_cosyvoice*"]

[tool.setuptools.package-data]
huri_tts_cosyvoice = ["huri_module.toml"]
