[build-system]
requires = ["setuptools>=64,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "huri-module-tts-piper"
version = "0.1.0"
description = "HuRI module: text to speech with Piper (ONNX, CPU, any machine)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huri-core[server]>=0.4.0.dev0,<0.5",
  "huri-events>=0.1,<0.2",
  "huri-tts>=0.1,<0.2",
  "numpy>=1.26,<2",
  "piper-tts>=1.8,<1.9",
]

[project.entry-points."huri.modules"]
tts = "huri_tts_piper.module:PiperTTS"

[tool.setuptools.packages.find]
include = ["huri_tts_piper*"]

[tool.setuptools.package-data]
huri_tts_piper = ["huri_module.toml"]
