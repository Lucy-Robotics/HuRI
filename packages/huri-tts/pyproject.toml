[build-system]
requires = ["setuptools>=64,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "huri-tts"
version = "0.1.0"
description = "Shared streaming logic of the HuRI text-to-speech modules (no engine)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huri-core[server]>=0.4.0.dev0,<0.5",
  "huri-events>=0.1,<0.2",
  "numpy>=1.26,<2",
]

[tool.setuptools.packages.find]
include = ["huri_tts*"]
