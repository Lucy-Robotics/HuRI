name = "stt"
summary = "Transcribes speech with faster-whisper (CPU or GPU)"
input = { topic = "huri.voice", event = "huri_events.speech:Voice" }
output = { topic = "huri.transcript", event = "huri_events.speech:Transcript" }
events = ["huri-events>=0.1,<0.2"]
requires = { gpu = false, actuation = false }
huri_core = ">=0.4.0.dev0,<0.5"
