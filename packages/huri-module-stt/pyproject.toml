[build-system]
requires = ["setuptools>=64,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "huri-module-stt"
version = "0.1.0"
description = "HuRI module: Speech to text (faster-whisper) as a Ray Serve deployment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huri-core[server]>=0.4.0.dev0,<0.5",
  "huri-events>=0.1,<0.2",
  "numpy>=1.26,<2",
  "faster-whisper>=1.2.1,<1.3",
]

[project.entry-points."huri.modules"]
stt = "huri_stt.module:STT"

[tool.setuptools.packages.find]
include = ["huri_stt*"]

[tool.setuptools.package-data]
huri_stt = ["huri_module.toml", "manifests/*/huri_module.toml"]
