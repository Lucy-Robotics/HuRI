[build-system]
requires = ["setuptools>=64,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "huri-module-rag"
version = "0.1.0"
description = "HuRI module: Retrieval-augmented answers with long-term memory (Qdrant + an OpenAI-compatible LLM), and the question aggregator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huri-core[server]>=0.4.0.dev0,<0.5",
  "huri-events>=0.1,<0.2",
  "numpy>=1.26,<2",
  "httpx>=0.27.2,<0.28",
  "qdrant-client>=1.18,<1.19",
  "sentence-transformers>=3.2.1,<3.3",
  "pypdf>=5.1,<5.2",
  "semantic_chunker==0.2.0",
  "pydantic>=2",
]

[project.entry-points."huri.modules"]
rag = "huri_rag.rag:RAG"
qag = "huri_rag.question_aggregator:QAG"

[tool.setuptools.packages.find]
include = ["huri_rag*"]

[tool.setuptools.package-data]
huri_rag = ["huri_module.toml", "manifests/*/huri_module.toml"]
