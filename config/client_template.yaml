# HuRI websocket server url
huri_url: ws://localhost:8000/session

# Topics this client publishes to HuRI. Every module input must be produced by
# another module of the session or listed here, or the session is rejected.
send: [huri.question]

# Topics this client receives. Each must be emitted by a module of the session.
subscribe: [huri.token]

# Define module to be used and their custom args
modules:
  # module tag can be anything
  example:
    # module name must be in the list of available module in HuRI's instance (its installed `huri.modules` entry points)
    name: my_module
    # if my_module init with "model", "sample_rate" and "hello" params, they can be customized here
    args:
      hello: world
  # a module that is not packaged can be given by import path instead of name;
  # the server must list that exact path in its HURI_MODULES
  # unpackaged:
  #   module: my_pkg.servo:Servo
