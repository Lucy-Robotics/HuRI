huri_url: ws://localhost:8000/session

interface_path: huri_core.interfaces.cli_interface:cli_interface

senders:
  text:
    name: text
    topic: question

hooks:
  token:
    name: token
    topics: [token]

modules:
  rag:
    name: rag
    args:
      language: en
      tone: formal
      max_history_turns: 6
      temperature: 0.7
      response_format: short
      persona: ""
