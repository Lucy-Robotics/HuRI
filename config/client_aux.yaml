huri_url: ws://localhost:8000/session

interface_path: src.interfaces.cli_interface:cli_interface

senders:
  audio:
    name: audio
    topic: audio.in
    args:
      sample_rate: 16000
      frame_duration: 0.030
  text:
    name: text
    topic: question
    args:
      sample_rate: 16000
      frame_duration: 0.030

hooks:
  token:
    name: token
    topics: [token]
  audio:
    name: audio
    topics: [audio.out]
    args:
      incoming_sample_rate: ${senders.text.args.sample_rate}
      sample_rate: 44100
      # Belongs to the audio hook, not motion: MotionHook swallows unknown
      # kwargs silently, so parked under motion it would parse and then do
      # nothing. It was also indented one level too deep, which made the whole
      # file invalid YAML.
      save_audio_dir: "uuid"
  motion:
    name: motion
    topics: [motion]

modules:
  vad:
    name: vad
    args:
      vad_agressiveness: 3
      silence_duration: 1.5
      block_duration: ${senders.audio.args.frame_duration}
  stt:
    name: stt
    args:
      language: en
      block_duration: ${senders.audio.args.frame_duration}
    logging: INFO
  tag:
    name: tag
    args:
      min_prefix: 3
    logging: INFO
  emo:
    name: emo
    args:
      block_duration: ${senders.audio.args.frame_duration}
  eag:
    name: eag
  qag:
    name: qag
  rag:
    name: rag
    args:
      language: en
      tone: formal
      response_format: paragraph
      max_length: 1024
    logging: INFO
  tts:
    name: tts
    logging: INFO
  mov:
    name: mov
    logging: INFO
