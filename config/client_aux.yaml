huri_url: ws://localhost:8000/session

# Topics this client publishes, and the ones it receives.
send: [huri.audio.in, huri.question]
subscribe: [huri.token, huri.audio.out, huri.motion]

# Device settings of the CLI client (huri_core.interfaces.cli_interface);
# the server never reads them.
cli:
  audio_in:
    sample_rate: 16000
    frame_duration: 0.030
  audio_out:
    incoming_sample_rate: ${cli.audio_in.sample_rate}
    sample_rate: 44100
    save_audio_dir: "uuid"

modules:
  vad:
    name: vad
    args:
      vad_agressiveness: 3
      silence_duration: 1.5
      block_duration: ${cli.audio_in.frame_duration}
  stt:
    name: stt
    args:
      language: en
      block_duration: ${cli.audio_in.frame_duration}
    logging: INFO
  tag:
    name: tag
    args:
      min_prefix: 3
    logging: INFO
  emo:
    name: emo
    args:
      block_duration: ${cli.audio_in.frame_duration}
  eag:
    name: eag
  qag:
    name: qag
  rag:
    name: rag
    args:
      language: en
      tone: formal
      response_format: paragraph
      max_length: 1024
    logging: INFO
  tts:
    name: tts
    logging: INFO
  mov:
    name: mov
    logging: INFO
