huri_url: ws://localhost:8000/session
# Required by ClientConfig.from_dict; this was the only client config missing
# it, so the "everything on" example died with a bare KeyError.
interface_path: src.interfaces.cli_interface:cli_interface

senders:
  audio:
    name: audio
    topic: audio.in
    args:
      sample_rate: 16000
      frame_duration: 0.030
  text:
    name: text
    topic: question
    args:
      sample_rate: 16000
      frame_duration: 0.030

hooks:
  audio:
    name: audio
    topics: [audio.out]
    args:
      incoming_sample_rate: ${senders.audio.args.sample_rate}
      sample_rate: 44100
  motion:
    name: motion
    topics: [motion]

modules:
  vad:
    name: vad
    args:
      vad_agressiveness: 3
      silence_duration: 1.5
      block_duration: ${senders.audio.args.frame_duration}
    logging: INFO
  stt:
    name: stt
    args:
      language: en
      block_duration: ${senders.audio.args.frame_duration}
    logging: INFO
  tag:
    name: tag
    logging: INFO
  emo:
    name: emo
    args:
      block_duration: ${senders.audio.args.frame_duration}
  eag:
    name: eag
  qag:
    name: qag
  rag:
    name: rag
    args:
      language: en
      tone: formal
      response_format: paragraph
      max_length: 1024
    logging: INFO
  tts:
    name: tts
    # No args: TTS.__init__ takes only the deployment handle, so any key here is
    # a TypeError at session start. `min_clause_chars` was a leftover from a
    # design where HuRI buffered clauses itself — CosyVoice's frontend does the
    # segmentation now.
    logging: INFO
  mov:
    name: mov
    logging: INFO
