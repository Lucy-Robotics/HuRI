name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: HuRI (core and curated events), pinned
        env:
          HURI_REF: main  # pin a tag once you depend on a release
        run: |
          pip install \
            "huri-core[server] @ git+https://github.com/Lucy-Robotics/HuRI.git@${HURI_REF}" \
            "huri-events @ git+https://github.com/Lucy-Robotics/HuRI.git@${HURI_REF}#subdirectory=packages/huri-events"
      - run: ./install.sh --variant cpu
      - run: pytest -q
