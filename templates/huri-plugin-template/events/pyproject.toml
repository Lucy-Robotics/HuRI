[build-system]
requires = ["setuptools>=64,<82"]
build-backend = "setuptools.build_meta"

# The events your module introduces, as their own light distribution: a client
# installs this (not the module and its heavy dependencies) to decode them.
[project]
name = "huri-events-example"
version = "0.1.0"
description = "Events of the example HuRI module"
requires-python = ">=3.10"
dependencies = ["huri-core>=0.4.0.dev0,<0.5"]

# Topic -> class. Use your own namespace ("example."), never "huri." (reserved
# for the curated events), and only one namespace per package.
[project.entry-points."huri.events"]
"example.shout" = "huri_events_example:Shout"

[tool.setuptools.packages.find]
include = ["huri_events_example*"]
