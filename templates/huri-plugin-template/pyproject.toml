[build-system]
requires = ["setuptools>=64,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "huri-module-example"
version = "0.1.0"
description = "An example HuRI module: shouts every finished transcript"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huri-core[server]>=0.4.0.dev0,<0.5",
  "huri-events>=0.1,<0.2",          # the curated events it consumes
  "huri-events-example>=0.1,<0.2",  # the events it introduces (events/)
  # Your module's own dependencies go here; hardware-specific pins go in
  # requirements-{cpu,nvidia,amd}.txt (install.sh picks one).
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# How HuRI finds the module: once installed, `name: shout` works in a client's
# YAML (and the server's HURI_MODULES).
[project.entry-points."huri.modules"]
shout = "huri_example.module:Shouter"

[tool.setuptools.packages.find]
include = ["huri_example*"]

[tool.setuptools.package-data]
huri_example = ["huri_module.toml"]
