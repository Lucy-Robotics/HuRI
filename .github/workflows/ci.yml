# huri-core's checks, on every push and pull request. huri-core is tested on
# its own: no module and no curated event is installed here (those live in
# https://github.com/Lucy-Robotics/huri-modules, whose CI runs them against
# this repository's `dev` as a canary, so a breaking change shows up there
# before a release).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (black, isort, flake8, mypy, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install the lint toolchain only
        # mypy has ignore_missing_imports, so it runs without Ray or FastAPI.
        run: pip install -c constraints.txt -e ".[dev]"
      - run: black --check huri_core scripts tests
      - run: isort --check-only huri_core scripts tests
      - run: flake8 huri_core scripts tests
      - run: mypy huri_core scripts --check-untyped-defs
      - name: links of README, CONTRIBUTING, RELEASING and docs/
        # Offline: relative links and anchors, and every Lucy-Robotics URL
        # names a known repository (not the old HuRI name, not HuRI-landing).
        run: python scripts/check_links.py

  test:
    name: pytest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: install huri-core with every extra
        run: pip install -c constraints.txt -e ".[server,client,dev]"
      - run: pytest -q

  client:
    name: client extra without the server stack
    # What a robot or an app installs: the client SDK and the base classes must
    # import and work with neither Ray nor FastAPI. tests/core/conftest.py leaves
    # the server's own tests out here; test_packaging checks the imports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e ".[client,dev]"
      - name: the server stack is really absent
        run: |
          for m in ray fastapi; do
            if python -c "import $m" 2>/dev/null; then
              echo "::error::$m is installed by huri-core[client]"; exit 1
            fi
          done
      - run: pytest -q

  build:
    name: sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: the wheel installs alone and carries the framework only
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/python - <<'PY'
          import importlib.metadata as md
          import huri_core, huri_core.core.module, huri_core.testing
          assert md.version("huri-core") == huri_core.__version__
          files = [str(f) for f in md.files("huri-core")]
          stray = [f for f in files if f.startswith("tests/")]
          assert not stray, stray
          assert "huri_core/py.typed" in files, "py.typed is not shipped"
          print("huri-core", huri_core.__version__, "-", len(files), "files")
          PY
