[build-system]
requires = ["setuptools>=64,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "huri-core"
dynamic = ["version"]
description = "HuRI: realtime, modular conversational pipeline for robots"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# The base install is the abstract framework only (Module, EventData, bus):
# no third-party dependency. Heavy parts sit behind extras so a client never
# installs Ray or FastAPI. requirements*.txt keep the exact pins the images and
# install_local.sh use; tests/core/test_packaging.py keeps both in step.
dependencies = []

[project.optional-dependencies]
# Ray Serve app builder + FastAPI ingress, and the pins that constrain that
# process whatever modules are loaded (see constraints.txt for the why of each).
server = [
  "ray[serve]>=2.55.1,<2.56",
  "fastapi<0.139.2",
  "protobuf==4.25.8",
  "setuptools<82",
  "click<8.2",
  # Version ranges of module manifests (huri_module.toml).
  "packaging>=23",
  "tomli>=2; python_version < '3.11'",
]
# Client SDK: websocket transport and YAML config loading.
client = [
  "websockets>=16,<17",
  "omegaconf>=2.3,<2.4",
]
# Dependencies of the TTS module, the last curated module inside huri-core
# (#84 splits it per backend). Every other module declares its own, in its
# package under packages/.
tts = [
  "huri-core[server]",
  "numpy>=1.26,<2",
  "piper-tts>=1.8,<1.9",
]
dev = [
  "black==26.3.1",
  "flake8==7.3.0",
  "flake8-toml-config==1.0.0",
  "isort==8.0.1",
  "mypy==1.20.2",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
]

[project.urls]
Repository = "https://github.com/Lucy-Robotics/HuRI"

# Plugin registration (see huri_core/core/plugins.py). An installed package
# adds modules and events the same way, from its own pyproject.toml; the
# curated events are registered by huri-events (packages/huri-events) and the
# curated modules by their packages (packages/huri-module-*).
[project.entry-points."huri.modules"]
# Still in huri-core until #84 splits it per backend.
tts = "huri_core.modules.text_to_speech.text_to_speech:TTS"

[tool.setuptools.dynamic]
# Single source of truth: huri_core/__init__.py. See RELEASING.md.
version = { attr = "huri_core.__version__" }

[tool.setuptools.packages.find]
include = ["huri_core*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
skip_gitignore = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
exclude = """
  __pycache__
  venv
  .venv
"""

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
exclude = [
  "^tests/",
  "^packages/[^/]+/tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/*/tests"]
# Separate distributions living in this repo (packages/*, examples/cli).
pythonpath = [
  "packages/huri-events",
  "packages/huri-module-vad",
  "packages/huri-module-stt",
  "packages/huri-module-tag",
  "packages/huri-module-emo",
  "packages/huri-module-rag",
  "packages/huri-module-mov",
  "examples/cli",
]
python_files = ["test_*.py"]
