[build-system]
requires = ["setuptools>=64,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "huri-core"
dynamic = ["version"]
description = "HuRI core: the framework of a realtime, modular conversational pipeline for robots"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# The base install is the abstract framework only (Module, EventData, bus):
# no third-party dependency. Heavy parts sit behind extras so a client never
# installs Ray or FastAPI. constraints.txt repeats the server's pins for what
# gets installed next to it; tests/core/test_packaging.py keeps both in step.
dependencies = []

[project.optional-dependencies]
# Ray Serve app builder + FastAPI ingress, and the pins that constrain that
# process whatever modules are loaded (see constraints.txt for the why of each).
server = [
  "ray[serve]>=2.55.1,<2.56",
  "fastapi<0.139.2",
  "protobuf==4.25.8",
  "setuptools<82",
  "click<8.2",
  # Version ranges of module manifests (huri_module.toml).
  "packaging>=23",
  "tomli>=2; python_version < '3.11'",
]
# Client SDK: websocket transport and YAML config loading.
client = [
  "websockets>=16,<17",
  "omegaconf>=2.3,<2.4",
]
dev = [
  "black==26.3.1",
  "flake8==7.3.0",
  "flake8-toml-config==1.0.0",
  "isort==8.0.1",
  "mypy==1.20.2",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  # The tests read manifests and requirements, which only the server needs at
  # runtime: CI's client job installs [client,dev].
  "packaging>=23",
  "tomli>=2; python_version < '3.11'",
]

[project.scripts]
# A dispatcher over the "huri.commands" entry points of installed packages
# (huri_core/cli.py): huri-core itself provides no command.
huri = "huri_core.cli:main"

[project.urls]
Homepage = "https://github.com/Lucy-Robotics/huri-core"
Repository = "https://github.com/Lucy-Robotics/huri-core"
Documentation = "https://github.com/Lucy-Robotics/huri-core#readme"
Changelog = "https://github.com/Lucy-Robotics/huri-core/releases"
Modules = "https://github.com/Lucy-Robotics/huri-modules"

# huri-core registers no module and no event: the curated ones come from their
# own packages in https://github.com/Lucy-Robotics/huri-modules (huri-events,
# huri-module-*), through the entry points in their pyproject.toml (see
# huri_core/core/plugins.py).

[tool.setuptools.dynamic]
# Single source of truth: huri_core/__init__.py. See RELEASING.md.
version = { attr = "huri_core.__version__" }

[tool.setuptools.packages.find]
include = ["huri_core*"]

[tool.setuptools.package-data]
# PEP 561: type checkers of projects that install huri-core (huri-modules' CI,
# module authors) read its annotations.
huri_core = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
skip_gitignore = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
exclude = """
  __pycache__
  venv
  .venv
"""

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
exclude = [
  "^tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
