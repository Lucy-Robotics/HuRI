[build-system]
requires = ["setuptools>=64,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "huri-core"
dynamic = ["version"]
description = "HuRI: realtime, modular conversational pipeline for robots"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# The base install is the abstract framework only (Module, EventData, bus):
# no third-party dependency. Heavy parts sit behind extras so a client never
# installs Ray or FastAPI. requirements*.txt keep the exact pins the images and
# install_local.sh use; tests/core/test_packaging.py keeps both in step.
dependencies = []

[project.optional-dependencies]
# Ray Serve app builder + FastAPI ingress, and the pins that constrain that
# process whatever modules are loaded (see constraints.txt for the why of each).
server = [
  "ray[serve]>=2.55.1,<2.56",
  "fastapi<0.139.2",
  "protobuf==4.25.8",
  "setuptools<82",
  "click<8.2",
]
# Client SDK: websocket transport and YAML config loading.
client = [
  "websockets>=16,<17",
  "omegaconf>=2.3,<2.4",
]
# The reference CLI client (huri_core.interfaces.cli_interface).
cli = [
  "huri-core[client]",
  "numpy>=1.26,<2",
  "scipy",
  "sounddevice>=0.5,<0.6",
  "prompt-toolkit>=3.0,<3.1",
]
# Dependencies of the curated modules still living in this repo (CPU set; the
# GPU backends stay in requirements-{nvidia,amd}.txt). They move to each
# module's own package when modules are split out.
modules = [
  "huri-core[server]",
  "numpy>=1.26,<2",
  "webrtcvad==2.0.10",
  "faster-whisper>=1.2.1,<1.3",
  "piper-tts>=1.8,<1.9",
  "qdrant-client>=1.18,<1.19",
  "sentence-transformers>=3.2.1,<3.3",
  "pypdf>=5.1,<5.2",
  "semantic_chunker==0.2.0",
  "httpx>=0.27.2,<0.28",
]
dev = [
  "black==26.3.1",
  "flake8==7.3.0",
  "flake8-toml-config==1.0.0",
  "isort==8.0.1",
  "mypy==1.20.2",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
]

[project.urls]
Repository = "https://github.com/Lucy-Robotics/HuRI"

# Plugin registration (see huri_core/core/plugins.py). An installed package
# adds modules and events the same way, from its own pyproject.toml.
[project.entry-points."huri.modules"]
vad = "huri_core.modules.speech_to_text.microphone_vad:VAD"
stt = "huri_core.modules.speech_to_text.speech_to_text:STT"
tag = "huri_core.modules.speech_to_text.text_aggregator:TAG"
emo = "huri_core.modules.emotion.prosody_analysis:EMO"
eag = "huri_core.modules.emotion.emotion_aggregator:EAG"
qag = "huri_core.modules.rag.question_aggregator:QAG"
rag = "huri_core.modules.rag.rag:RAG"
tts = "huri_core.modules.text_to_speech.text_to_speech:TTS"
mov = "huri_core.modules.gesture.gesture:MOV"

[project.entry-points."huri.events"]
"huri.audio.in" = "huri_core.core.events:BytesEvent"  # inbound mic frames (raw int16 PCM)
"huri.audio.out" = "huri_core.modules.text_to_speech.events:Audio"
"huri.voice" = "huri_core.modules.speech_to_text.events:Voice"
"huri.transcript" = "huri_core.modules.speech_to_text.events:Transcript"
"huri.emotion" = "huri_core.modules.emotion.events:Emotion"
"huri.partial_question" = "huri_core.modules.rag.events:PartialQuestion"
"huri.question" = "huri_core.modules.rag.events:RAGQuestion"
"huri.token" = "huri_core.modules.text_to_speech.events:Token"
"huri.motion" = "huri_core.modules.gesture.events:Motion"

[tool.setuptools.dynamic]
# Single source of truth: huri_core/__init__.py. See RELEASING.md.
version = { attr = "huri_core.__version__" }

[tool.setuptools.packages.find]
include = ["huri_core*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
skip_gitignore = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
exclude = """
  __pycache__
  venv
  .venv
"""

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
exclude = [
  "^tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
